[package]
name = "bevy_autodiff_fit"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Nathan Strange <info@visviva.space>"]
description = "Piecewise Chebyshev polynomial fitting for bevy_autodiff"
license = "MIT"
repository = "https://github.com/VisVivaSpace/bevy_autodiff"
homepage = "https://github.com/VisVivaSpace/bevy_autodiff"
documentation = "https://docs.rs/bevy_autodiff_fit"
readme = "README.md"
keywords = ["autodiff", "chebyshev", "fitting", "interpolation", "derivatives"]
categories = ["science", "mathematics"]
exclude = ["target/"]

[dependencies]
bevy_autodiff = { version = "0.8", path = ".." }
thiserror = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
