[package]
name = "bevy_autodiff"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
authors = ["Nathan Strange <info@visviva.space>"]
description = "Automatic differentiation using Bevy ECS as computation graph"
license = "MIT"
repository = "https://github.com/VisVivaSpace/bevy_autodiff.git"
homepage = "https://github.com/VisVivaSpace/bevy_autodiff"
documentation = "https://docs.rs/bevy_autodiff"
readme = "README.md"
keywords = ["autodiff", "differentiation", "bevy", "ecs", "derivatives"]
categories = ["science", "mathematics"]
exclude = ["CLAUDE.md", ".claude/", "tasks/", "notes/"]

[dependencies]
bevy_ecs = "0.18"
bevy_entity_ptr = "0.5"
bevy_autodiff-macros = { version = "0.1.0", path = "./bevy_autodiff-macros", optional = true }
wgpu = { version = "27", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = []
std_autodiff_tests = []
proc-macros = ["bevy_autodiff-macros"]
wgpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dev-dependencies]
approx = "0.5"
autodiff = "0.7"
criterion = "0.5"
rkf78 = "0.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "compiled_vs_ecs"
harness = false

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "gradient"
path = "examples/gradient.rs"

[[example]]
name = "hessian"
path = "examples/hessian.rs"

[[example]]
name = "rosenbrock"
path = "examples/rosenbrock.rs"

[[example]]
name = "orbital_mechanics"
path = "examples/orbital_mechanics.rs"

[[example]]
name = "reverse_gradient"
path = "examples/reverse_gradient.rs"

[[example]]
name = "stm_propagation"
path = "examples/stm_propagation.rs"

[[example]]
name = "gpu_batch"
path = "examples/gpu_batch.rs"
required-features = ["wgpu"]
