[package]
name = "bevy_autodiff-macros"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
authors = ["Nathan Strange <info@visviva.space>"]
description = "Procedural macros for bevy_autodiff automatic differentiation"
license = "MIT"
repository = "https://github.com/VisVivaSpace/bevy_autodiff"
homepage = "https://github.com/VisVivaSpace/bevy_autodiff"
documentation = "https://docs.rs/bevy_autodiff"
keywords = ["autodiff", "differentiation", "bevy", "macros"]
categories = ["science", "mathematics"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"
